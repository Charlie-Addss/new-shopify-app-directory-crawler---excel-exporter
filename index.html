<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully stub vite-hmr WebSocket in Cloud Run/iframe environment where HMR is disabled
      (function() {
        if (typeof window !== 'undefined') {
          const OriginalWS = window.WebSocket;
          if (OriginalWS) {
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('24678')))) {
                var target = new EventTarget();
                target.readyState = 1;
                target.send = function() {};
                target.close = function() {};
                setTimeout(function() {
                  target.dispatchEvent(new Event('open'));
                }, 0);
                return target;
              }
              return new OriginalWS(url, protocols);
            };
            window.WebSocket.prototype = OriginalWS.prototype;
            window.WebSocket.CONNECTING = 0;
            window.WebSocket.OPEN = 1;
            window.WebSocket.CLOSING = 2;
            window.WebSocket.CLOSED = 3;
          }
          window.addEventListener('unhandledrejection', function(event) {
            var reason = event && event.reason;
            var msg = reason && (reason.message || String(reason));
            var stack = reason && (reason.stack || '');
            if (msg && (msg.includes('WebSocket') || msg.includes('vite:ws') || stack.includes('@vite/client') || stack.includes('createWebSocketModuleRunnerTransport'))) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          }, true);
        }
      })();
    </script>
